<!DOCTYPE html>
<html lang="fr" data-i18n-title="reg.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — Talenco.bj</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 32px; width: 100%; max-width: 440px; }
    .auth-title { font-family: var(--font-serif); font-style: italic; font-size: 24px; text-align: center; margin-bottom: 6px; }
    .auth-sub { font-family: var(--font-body); font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
    .auth-role-tabs { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 20px; }
    .auth-role-btn { flex: 1; padding: 9px; font-family: var(--font-body); font-size: 12px; font-weight: 500; background: none; border: none; cursor: pointer; color: var(--text-muted); transition: background .15s, color .15s; }
    .auth-role-btn.active { background: var(--text); color: var(--bg); }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .form-row-2 { grid-template-columns: 1fr; } .auth-card { padding: 24px 18px; } }
  </style>
</head>
<body class="auth-page">

<nav class="navbar">
  <a href="/index.html" class="talenco-logo">
    <div class="nav-logo">
      <div class="nav-logo-mark"><svg width="28" height="28" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg"><path d="M8,34 Q34,7 60,34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M60,34 Q34,61 8,34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="34" cy="34" r="4.5" fill="currentColor"/></svg></div><div class="nav-logo-words"><div class="nav-logo-text"><span class="logo-primary"><span class="base">Talen</span><span class="co">co</span></span></div><div class="logo-tagline">by GSE</div></div>
    </div>
  </a>
  <ul class="navbar-links">
    <li><a href="/offres.html" data-i18n="nav.jobs">Offres</a></li>
  </ul>
  <div class="navbar-actions">
    <a href="/connexion.html" class="btn btn-dark btn-sm" data-i18n="nav.login">Se connecter</a>
  </div>
</nav>

<div class="auth-center">
  <div class="auth-card">
    <h1 class="auth-title" data-i18n="reg.h1">Créer un compte</h1>
    <p class="auth-sub" data-i18n="reg.sub">Rejoignez Talenco.bj gratuitement</p>

    <div class="auth-role-tabs">
      <button class="auth-role-btn active" id="role-candidat" data-role="candidat" data-i18n="reg.role.cand">Candidat</button>
      <button class="auth-role-btn" id="role-recruteur" data-role="recruteur" data-i18n="reg.role.recruiter">Recruteur</button>
    </div>

    <div id="auth-msg" class="alert" style="display:none;margin-bottom:16px;"></div>

    <div class="form-row-2">
      <div class="form-field">
        <label class="form-label" data-i18n="reg.firstname">Prénom</label>
        <input type="text" id="reg-prenom" placeholder="Votre prénom" data-i18n-ph="reg.firstname.ph">
      </div>
      <div class="form-field">
        <label class="form-label" data-i18n="reg.lastname">Nom</label>
        <input type="text" id="reg-nom" placeholder="Votre nom" data-i18n-ph="reg.lastname.ph">
      </div>
    </div>
    <div class="form-field">
      <label class="form-label" data-i18n="reg.email">Email</label>
      <input type="email" id="reg-email" placeholder="votre@email.com" data-i18n-ph="cnx.email.ph" autocomplete="email">
    </div>
    <div id="reg-entreprise-field" class="form-field" style="display:none;">
      <label class="form-label" data-i18n="reg.company">Nom de l'entreprise</label>
      <input type="text" id="reg-entreprise" placeholder="Nom de votre entreprise" data-i18n-ph="reg.company.ph">
    </div>
    <div id="reg-diaspora-field" class="form-field" style="display:none;">
      <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);">
        <input type="checkbox" id="reg-is-diaspora" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin-top:2px;flex-shrink:0;">
        <div>
          <div style="font-size:13px;font-weight:500;" data-i18n="reg.diaspora.title">Je suis de la diaspora</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;" data-i18n="reg.diaspora.desc">Vous résidez à l'étranger et souhaitez travailler au Bénin ou à distance. Cette information sera visible sur votre profil uniquement si vous le souhaitez.</div>
        </div>
      </label>
    </div>
    <div class="form-field">
      <label class="form-label" data-i18n="reg.password">Mot de passe</label>
      <input type="password" id="reg-password" placeholder="Minimum 8 caractères" data-i18n-ph="reg.password.ph" autocomplete="new-password">
    </div>

    <div id="cv-field" class="form-field" style="margin-top:4px;">
      <label class="form-label"><span data-i18n="reg.cv.label">CV (PDF)</span> <span style="color:var(--accent);font-size:11px;" data-i18n="reg.cv.required">obligatoire</span></label>
      <label id="cv-drop-zone" for="cv-file" style="display:block;border:2px dashed var(--border);border-radius:var(--radius-sm);padding:18px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;">
        <input type="file" id="cv-file" accept=".pdf" style="display:none;">
        <div id="cv-drop-label" style="font-size:13px;color:var(--text-muted);pointer-events:none;">
          <div style="font-size:22px;margin-bottom:6px;">📎</div>
          <span data-i18n="reg.cv.click">Cliquez pour choisir votre CV</span>
        </div>
        <div id="cv-selected" style="display:none;font-size:13px;font-weight:500;color:#15803d;pointer-events:none;"></div>
      </label>
      <div style="font-size:11px;color:var(--text-muted);margin-top:5px;" data-i18n="reg.cv.hint">Format PDF uniquement · 5 Mo maximum</div>
    </div>

    <div id="linkedin-field" class="form-field" style="display:none;">
      <label class="form-label">LinkedIn <span style="font-size:11px;font-weight:400;color:var(--text-muted);" data-i18n="reg.linkedin.opt">(optionnel)</span></label>
      <input type="url" id="reg-linkedin" placeholder="https://linkedin.com/in/votre-profil" data-i18n-ph="reg.linkedin.ph">
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px;" data-i18n="reg.linkedin.hint">Visible uniquement par les recruteurs qui consultent votre profil</div>
    </div>

    <button class="btn btn-dark btn-full" id="btn-register" style="margin-top:8px;" data-i18n="reg.btn">Créer mon compte</button>

    <div class="auth-footer">
      <span data-i18n="reg.already">Déjà un compte ?</span> <a href="/connexion.html" data-i18n="reg.login">Se connecter</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  var SUPABASE_URL     = 'https://ywteoxnkkdgdpbkrlkar.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3dGVveG5ra2RnZHBia3Jsa2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MjA1MjYsImV4cCI6MjA5MDA5NjUyNn0.jzgNVgYR6iCEV_GIpvBTs4aN3RzK3E3MJW9YtBmLI3c';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let selectedRole = 'candidat';

  // ── Phase bêta : fin le 12 juillet 2026 ──
  const TEST_PHASE_END = '2026-07-12T00:00:00.000Z';
  const isTestPhase    = new Date() < new Date(TEST_PHASE_END);

  // Bannière phase test
  if (isTestPhase) {
    const sub = document.querySelector('.auth-sub');
    if (sub) sub.textContent = 'Phase bêta — Accès gratuit jusqu\'au 12 juillet 2026';
  }

  document.querySelectorAll('.auth-role-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.auth-role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedRole = btn.dataset.role;
      const entrepriseField = document.getElementById('reg-entreprise-field');
      if (selectedRole === 'recruteur') {
        showMsg('info', 'L\'accès recruteur est sur invitation uniquement. Vous avez reçu un lien personnalisé ? Utilisez-le directement.');
        entrepriseField.style.display = 'none';
        document.getElementById('reg-diaspora-field').style.display = 'none';
        document.getElementById('cv-field').style.display = 'none';
        document.getElementById('linkedin-field').style.display = 'none';
      } else {
        document.getElementById('auth-msg').style.display = 'none';
        entrepriseField.style.display = 'none';
        document.getElementById('reg-diaspora-field').style.display = 'block';
        document.getElementById('cv-field').style.display = 'block';
        document.getElementById('linkedin-field').style.display = 'block';
      }
    });
  });

  // Feedback visuel quand un fichier est sélectionné
  document.getElementById('cv-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const zone = document.getElementById('cv-drop-zone');
    if (file) {
      document.getElementById('cv-drop-label').style.display = 'none';
      const sel = document.getElementById('cv-selected');
      sel.style.display = 'block';
      sel.textContent = '✅ ' + file.name;
      zone.style.borderColor = '#15803d';
      zone.style.background = '#f0fdf4';
    } else {
      document.getElementById('cv-drop-label').style.display = 'block';
      document.getElementById('cv-selected').style.display = 'none';
      zone.style.borderColor = '';
      zone.style.background = '';
    }
  });

  function showMsg(type, text) {
    const el = document.getElementById('auth-msg');
    el.className = `alert alert-${type}`;
    el.textContent = text;
    el.style.display = 'block';
  }

  async function connexionGoogle() { /* Google OAuth désactivé en phase bêta */ }

  document.getElementById('btn-register').addEventListener('click', async () => {
    const prenom   = document.getElementById('reg-prenom').value.trim();
    const nom      = document.getElementById('reg-nom').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const entreprise = document.getElementById('reg-entreprise').value.trim();

    if (!email || !password) { showMsg('error', 'Email et mot de passe requis.'); return; }
    if (password.length < 8) { showMsg('error', 'Le mot de passe doit contenir au moins 8 caractères.'); return; }

    // Validation CV obligatoire pour les candidats
    if (selectedRole === 'candidat') {
      const cvFile = document.getElementById('cv-file').files[0];
      if (!cvFile) { showMsg('error', 'Veuillez joindre votre CV (PDF) pour créer votre compte.'); document.getElementById('cv-drop-zone').style.borderColor = '#b91c1c'; return; }
      if (cvFile.type !== 'application/pdf') { showMsg('error', 'Le CV doit être un fichier PDF.'); return; }
      if (cvFile.size > 5 * 1024 * 1024) { showMsg('error', 'Le CV ne doit pas dépasser 5 Mo.'); return; }
    }

    const btn = document.getElementById('btn-register');
    btn.disabled = true; btn.textContent = 'Création du compte…';

    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { prenom, nom, role: selectedRole, entreprise: entreprise || null } },
    });

    if (error) {
      showMsg('error', error.message);
      btn.disabled = false; btn.textContent = 'Créer mon compte';
      return;
    }

    if (data?.user) {
      const linkedinVal = document.getElementById('reg-linkedin').value.trim();
      const userPayload = {
        id:         data.user.id,
        email,
        full_name:  `${prenom} ${nom}`.trim(),
        role:       selectedRole === 'recruteur' ? 'company' : 'candidate',
        is_diaspora: document.getElementById('reg-is-diaspora').checked,
        ...(selectedRole === 'candidat' && linkedinVal ? { linkedin_url: linkedinVal } : {}),
      };
      // Phase test : activation automatique pour les candidats
      if (isTestPhase && selectedRole === 'candidat') {
        userPayload.status           = 'active';
        userPayload.subscription_end = TEST_PHASE_END;
        userPayload.test_phase       = true;
      }
      const { error: dbError } = await sb.from('users').upsert(userPayload);
      if (dbError) { showMsg('error', 'Erreur lors de l\'enregistrement du compte.'); btn.disabled = false; btn.textContent = 'Créer mon compte'; return; }
    }

    if (selectedRole === 'candidat') {
      // Upload du CV immédiatement après création du compte
      const cvFile = document.getElementById('cv-file').files[0];
      btn.textContent = 'Upload du CV…';
      const cvPath = `${data.user.id}/cv.pdf`;
      const { error: uploadErr } = await sb.storage
        .from('CVS')
        .upload(cvPath, cvFile, { contentType: 'application/pdf', upsert: true });
      if (!uploadErr) {
        await sb.from('users').update({ cv_url: cvPath }).eq('id', data.user.id);
      }
      showMsg('success', uploadErr ? 'Compte créé ! (CV à re-uploader dans votre profil).' : 'Compte créé avec votre CV. Redirection…');
      btn.textContent = 'Compte créé';
      setTimeout(() => { window.location.href = uploadErr ? '/candidat.html?cv_requis=1#mon-cv' : '/candidat.html'; }, 1500);
    } else {
      showMsg('success', 'Compte créé avec succès. Vérifiez votre email pour activer votre compte.');
      btn.textContent = 'Compte créé';
    }
  });
</script>
<script src="/nav-mobile.js"></script>
<script src="/bug-report.js"></script>
<script src="/i18n.js"></script>
</body>
</html>
