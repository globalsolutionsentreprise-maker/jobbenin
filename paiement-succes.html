<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement réussi — Talenco.bj</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#040D1C;color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#091628;border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:3rem 2.5rem;max-width:440px;width:100%;text-align:center}
.check-circle{width:80px;height:80px;border-radius:50%;background:rgba(61,202,128,.12);border:2px solid rgba(61,202,128,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;margin-bottom:.5rem}
.msg{color:#7B90B0;font-size:.95rem;line-height:1.65;margin-bottom:2rem}
.btn{display:inline-block;background:#F0A500;color:#000;padding:.85rem 2rem;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none}
.note{font-size:.78rem;color:#7B90B0;margin-top:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="check-circle">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3DCA80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1 id="title">Paiement réussi !</h1>
  <p class="msg" id="message">Votre abonnement est activé. Vérifiez votre email pour la confirmation.</p>
  <a href="offres.html" class="btn" id="cta-btn">Voir les offres →</a>
  <p class="note">Un email de confirmation a été envoyé à votre adresse.</p>
</div>
<script>
const type=new URLSearchParams(window.location.search).get('type');
const pack=new URLSearchParams(window.location.search).get('pack');
const packs={starter:'10 crédits',growth:'30 crédits',business:'100 crédits'};
if(type==='enterprise'){
  document.getElementById('title').textContent='Crédits ajoutés !';
  document.getElementById('message').textContent=`Votre achat de ${packs[pack]||'crédits'} est confirmé. Disponibles immédiatement dans votre espace recruteur.`;
  document.getElementById('cta-btn').textContent='Accéder à mon espace →';
  document.getElementById('cta-btn').href='entreprises.html';
}else if(type==='reactivation'){
  document.getElementById('title').textContent='Compte réactivé !';
  document.getElementById('message').textContent="Votre compte Talenco.bj est de nouveau actif. Accédez à toutes les offres.";
}
</script>
</body></html>
