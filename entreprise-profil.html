<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Entreprise — Talenco.bj</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    .profil-hero {
      border-bottom: 1px solid var(--border);
      padding: 36px 24px 28px;
    }
    .profil-hero-inner {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .company-logo {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .company-info { flex: 1; }
    .company-name { font-family: var(--font-serif); font-style: italic; font-size: 28px; margin: 0 0 6px; }
    .company-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .profil-body { max-width: 1140px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1fr 300px; gap: 32px; }
    .profil-section { margin-bottom: 24px; }
    .profil-section-label { font-family: var(--font-sans); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .profil-text { font-family: var(--font-body); font-size: 14px; font-weight: 300; line-height: 1.7; color: var(--text-mid); }
    @media (max-width: 768px) {
      .profil-body { grid-template-columns: 1fr; }
      .profil-hero { padding: 24px 16px; }
      .profil-body { padding: 20px 16px; }
    }

    /* ── Galerie photos ── */
    .photo-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    @media (max-width: 600px) { .photo-gallery { grid-template-columns: repeat(2, 1fr); } }
    .photo-item { position: relative; aspect-ratio: 4/3; border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-soft); border: 1px solid var(--border); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; transition: transform .3s; }
    .photo-item img:hover { transform: scale(1.03); }
    .photo-delete-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.6); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; }
    .photo-item:hover .photo-delete-btn { opacity: 1; }
    .photo-upload-slot { aspect-ratio: 4/3; border-radius: var(--radius-sm); border: 2px dashed var(--border); background: var(--bg-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: border-color .2s, background .2s; }
    .photo-upload-slot:hover { border-color: var(--accent); background: rgba(139,69,19,.04); }
    .photo-upload-slot svg { opacity: .3; }
    .photo-upload-slot span { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
    .photo-upload-slot.loading { opacity: .5; pointer-events: none; }

    /* ── Avis candidats ── */
    .review-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; }
    .review-stars { color: var(--accent); font-size: 14px; letter-spacing: .05em; }
    .review-title { font-family: var(--font-serif); font-style: italic; font-size: 15px; margin: 6px 0 4px; }
    .review-comment { font-size: 13px; color: var(--text-mid); line-height: 1.6; }
    .review-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 8px; }
    .star-input { display: flex; gap: 4px; flex-direction: row-reverse; justify-content: flex-end; margin: 8px 0; }
    .star-input input { display: none; }
    .star-input label { font-size: 22px; color: var(--border); cursor: pointer; transition: color .1s; }
    .star-input input:checked ~ label,
    .star-input label:hover,
    .star-input label:hover ~ label { color: var(--accent); }
    .company-avg-stars { color: var(--accent); font-size: 13px; margin-top: 4px; }

    /* ── Lightbox ── */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 9999; display: none; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; object-fit: contain; }
    .lightbox-close { position: fixed; top: 20px; right: 24px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; line-height: 1; }
  </style>
</head>

        <div class="nav-logo-mark"><svg width="28" height="28" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg"><path d="M8,34 Q34,7 60,34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M60,34 Q34,61 8,34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="34" cy="34" r="4.5" fill="currentColor"/></svg></div><div class="nav-logo-words"><div class="nav-logo-text"><span class="logo-primary"><span class="base">Talen</span><span class="co">co</span></span></div><div class="logo-tagline">by GSE</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/badge-nouveau.js"></script>
<script>
  var SUPABASE_URL     = 'https://ywteoxnkkdgdpbkrlkar.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3dGVveG5ra2RnZHBia3Jsa2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MjA1MjYsImV4cCI6MjA5MDA5NjUyNn0.jzgNVgYR6iCEV_GIpvBTs4aN3RzK3E3MJW9YtBmLI3c';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const drawer = document.getElementById('nav-drawer');
  document.getElementById('nav-toggle').addEventListener('click', () => drawer.classList.add('open'));
  document.getElementById('nav-overlay').addEventListener('click', () => drawer.classList.remove('open'));
  document.getElementById('nav-close').addEventListener('click', () => drawer.classList.remove('open'));

  const companyId = new URLSearchParams(location.search).get('id');

  async function chargerProfil() {
    let company = null;

    if (!companyId) {
      // Mode "mon profil" (recruteur connecté)
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = '/connexion.html'; return; }

      // L'admin est redirigé vers le panneau admin (pas de profil entreprise propre)
      const { data: userProfile } = await sb.from('users').select('role').eq('id', session.user.id).maybeSingle();
      if (userProfile?.role === 'admin') {
        window.location.href = '/admin.html';
        return;
      }

      const { data } = await sb.from('companies').select('*').eq('owner_id', session.user.id).maybeSingle();
      company = data;
    } else {
      // Vue publique — companyId peut être l'ID owner (user) ou l'ID company directement
      const { data: byOwner } = await sb.from('companies').select('*').eq('owner_id', companyId).maybeSingle();
      if (byOwner) {
        company = byOwner;
      } else {
        const { data: byId } = await sb.from('companies').select('*').eq('id', companyId).maybeSingle();
        company = byId;
      }
    }

    if (!company) { document.getElementById('profil-main').innerHTML = '<div style="text-align:center;padding:80px;"><p class="text-muted">Profil introuvable.</p></div>'; return; }

    document.title = `${company.name ?? 'Entreprise'} — Talenco.bj`;

    const { data: offres } = await sb.from('jobs').select('id, title, city, contract_type, created_at')
      .eq('company_id', company.id).eq('status', 'published').order('created_at', { ascending: false }).limit(6);

    // Avis candidats (SELECT public)
    const { data: reviews } = await sb.from('company_reviews')
      .select('rating, title, comment, is_anonymous, is_verified, created_at')
      .eq('company_id', company.id)
      .eq('status', 'approved')
      .order('created_at', { ascending: false })
      .limit(10);

    // Taux de réponse via RPC SECURITY DEFINER (bypasse RLS, visible publiquement)
    let tauxReponse = null;
    const { data: responseData } = await sb.rpc('get_company_response_days', { p_company_id: company.id });
    if (responseData !== null && responseData !== undefined) {
      tauxReponse = responseData;
    }

    const isOwner = !companyId; // pas de ?company_id dans l'URL = propriétaire
    window._companyId   = company.id;
    window._isOwner     = isOwner;
    window._photos      = company.photos || [];
    window._sbClient    = sb;

    document.getElementById('profil-main').innerHTML = `
      <div class="profil-hero">
        <div class="profil-hero-inner">
          <div class="company-logo">
            ${company.logo_url ? `<img src="${company.logo_url}" alt="${company.name}" style="width:100%;height:100%;object-fit:contain;border-radius:inherit;">` : '🏢'}
          </div>
          <div class="company-info">
            <h1 class="company-name">${company.name ?? 'Entreprise'}</h1>
            <div class="company-meta">
              ${company.city ? `<span>📍 ${company.city}</span>` : ''}
              ${company.sector ? `<span>🏷 ${company.sector}</span>` : ''}
              ${company.email ? `<span>✉️ ${company.email}</span>` : ''}
              ${company.is_verified ? `<span style="color:var(--accent);font-weight:600;">✓ Certifiée Talenco</span>` : ''}
            </div>
            ${company.avg_rating ? `<div class="company-avg-stars">${'★'.repeat(Math.round(company.avg_rating))}${'☆'.repeat(5-Math.round(company.avg_rating))} <span style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">${Number(company.avg_rating).toFixed(1)}/5 · ${company.review_count} avis</span></div>` : ''}
          </div>
          ${isOwner ? `<a href="/ajouter-offre.html" class="btn btn-primary">+ Publier une offre</a>` : ''}
        </div>
      </div>

      <div class="profil-body">
        <div>
          ${company.description ? `
            <div class="profil-section">
              <div class="profil-section-label">À propos</div>
              <p class="profil-text">${company.description}</p>
            </div>
          ` : ''}

          <div class="profil-section" id="section-photos">
            <div class="profil-section-label">Photos</div>
            <div class="photo-gallery" id="photo-gallery"></div>
          </div>

          <div class="profil-section" id="section-avis">
            <div class="profil-section-label">Avis candidats${company.review_count > 0 ? ` (${company.review_count})` : ''}</div>
            <div id="reviews-list">
              ${reviews?.length ? reviews.map(r => `
                <div class="review-card">
                  <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                  ${r.title ? `<div class="review-title">${r.title}</div>` : ''}
                  ${r.comment ? `<div class="review-comment">${r.comment}</div>` : ''}
                  <div class="review-meta">${r.is_anonymous ? 'Candidat anonyme' : 'Candidat'} · ${new Date(r.created_at).toLocaleDateString('fr-FR', {month:'long', year:'numeric'})}${r.is_verified ? ' · <span style="color:var(--accent)">✓ Candidature vérifiée</span>' : ''}</div>
                </div>
              `).join('') : '<p class="text-muted" style="font-size:13px;">Aucun avis pour le moment.</p>'}
            </div>
            <div id="review-form-container" style="margin-top:16px;"></div>
          </div>

          <div class="profil-section">
            <div class="profil-section-label">Offres en cours (${offres?.length ?? 0})</div>
            ${offres?.length ? `
              <div class="jobs-grid" style="margin-top:12px;">
                ${offres.map(j => `
                  <a href="/offre/${j.id}" class="job-card badge-nouveau-host">
                    ${badgeNouveau.badge(j.created_at)}
                    <div class="job-body">
                      <p class="job-title">${j.title}</p>
                      <div class="job-tags">
                        <span class="tag">${j.city ?? ''}</span>
                        <span class="tag">${j.contract_type ?? ''}</span>
                      </div>
                    </div>
                    <span class="job-time">${badgeNouveau.tempsRelatif(j.created_at)}</span>
                  </a>
                `).join('')}
              </div>
            ` : '<p class="text-muted">Aucune offre active pour le moment.</p>'}
          </div>
        </div>

        <div>
          <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;">
            <div class="profil-section-label" style="margin-bottom:12px;">Informations</div>
            ${company.city ? `<div style="margin-bottom:8px;font-size:13px;"><strong>Ville</strong><br><span class="text-muted">${company.city}</span></div>` : ''}
            ${company.sector ? `<div style="margin-bottom:8px;font-size:13px;"><strong>Secteur</strong><br><span class="text-muted">${company.sector}</span></div>` : ''}
            ${company.size ? `<div style="margin-bottom:8px;font-size:13px;"><strong>Taille</strong><br><span class="text-muted">${company.size}</span></div>` : ''}
            ${company.website ? `<div style="margin-bottom:8px;font-size:13px;"><strong>Site web</strong><br><a href="${company.website}" target="_blank" class="text-muted">${company.website}</a></div>` : ''}
            <div style="margin-bottom:8px;font-size:13px;"><strong>Offres publiées</strong><br><span class="text-muted">${offres?.length ?? 0}</span></div>
            ${tauxReponse !== null ? `<div style="margin-bottom:8px;font-size:13px;"><strong>Taux de réponse</strong><br><span style="color:#2E7D32;font-family:var(--font-mono);font-size:12px;">✓ Répond en ${tauxReponse} jour${tauxReponse > 1 ? 's' : ''} en moy.</span></div>` : ''}
            ${company.avg_rating ? `<div style="font-size:13px;"><strong>Note candidats</strong><br><span style="color:var(--accent);font-size:13px;">${'★'.repeat(Math.round(company.avg_rating))}${'☆'.repeat(5-Math.round(company.avg_rating))}</span> <span class="text-muted" style="font-size:12px;">${Number(company.avg_rating).toFixed(1)}/5</span></div>` : ''}
          </div>
        </div>
      </div>
    `;

    renderGallery();
    initReviewForm(company.id);
  }

  async function initReviewForm(companyId) {
    const container = document.getElementById('review-form-container');
    if (!container) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      container.innerHTML = `<p style="font-size:12px;color:var(--text-muted);">
        <a href="/connexion.html" style="color:var(--accent)">Connectez-vous</a> pour laisser un avis.</p>`;
      return;
    }
    const { data: userProfile } = await sb.from('users').select('role').eq('id', session.user.id).maybeSingle();
    if (userProfile?.role !== 'candidat') return;

    const { data: existing } = await sb.from('company_reviews')
      .select('id').eq('company_id', companyId).eq('candidate_id', session.user.id).maybeSingle();
    if (existing) {
      container.innerHTML = '<p style="font-size:12px;color:var(--text-muted);font-style:italic;">Vous avez déjà laissé un avis sur cette entreprise.</p>';
      return;
    }

    const { data: jobsData } = await sb.from('jobs').select('id').eq('company_id', companyId);
    if (!jobsData?.length) return;
    const { data: appData } = await sb.from('applications')
      .select('id').in('job_id', jobsData.map(j => j.id)).eq('user_id', session.user.id).limit(1);
    if (!appData?.length) return;

    container.innerHTML = `
      <div style="background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;">
        <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:12px;">Laisser un avis</div>
        <div class="star-input" id="star-input">
          ${[5,4,3,2,1].map(n => `<input type="radio" name="rating" id="star${n}" value="${n}"><label for="star${n}">★</label>`).join('')}
        </div>
        <input id="rev-title" placeholder="Titre (optionnel)" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg-card);margin-bottom:8px;">
        <textarea id="rev-comment" rows="3" placeholder="Votre expérience avec ce recruteur…" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg-card);resize:vertical;"></textarea>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);margin:8px 0;cursor:pointer;">
          <input type="checkbox" id="rev-anon"> Rester anonyme
        </label>
        <button onclick="submitReview('${companyId}','${session.user.id}')" class="btn btn-dark btn-sm">Envoyer l'avis</button>
        <p id="rev-msg" style="font-size:12px;margin-top:8px;"></p>
      </div>`;
  }

  async function submitReview(companyId, userId) {
    const rating = document.querySelector('input[name="rating"]:checked')?.value;
    if (!rating) { document.getElementById('rev-msg').textContent = 'Choisissez une note.'; return; }
    const title   = document.getElementById('rev-title').value.trim();
    const comment = document.getElementById('rev-comment').value.trim();
    const anon    = document.getElementById('rev-anon').checked;
    const btn     = document.querySelector('#review-form-container button');
    btn.disabled  = true;
    const { error } = await sb.from('company_reviews').insert({
      company_id: companyId, candidate_id: userId,
      rating: parseInt(rating), title: title || null, comment: comment || null,
      is_anonymous: anon, status: 'pending'
    });
    btn.disabled = false;
    const msg = document.getElementById('rev-msg');
    if (error) { msg.style.color = 'red'; msg.textContent = 'Erreur : ' + error.message; }
    else { msg.style.color = 'green'; msg.textContent = 'Merci ! Votre avis sera publié après modération.'; btn.style.display = 'none'; }
  }

  const MAX_PHOTOS = 6;

  function renderGallery() {
    const gallery = document.getElementById('photo-gallery');
    if (!gallery) return;
    const photos  = window._photos || [];
    const isOwner = window._isOwner;

    let html = photos.map((url, i) => `
      <div class="photo-item">
        <img src="${url}" alt="Photo ${i + 1}" onclick="openLightbox('${url}')">
        ${isOwner ? `<button class="photo-delete-btn" onclick="deletePhoto(${i})" title="Supprimer">✕</button>` : ''}
      </div>
    `).join('');

    if (isOwner && photos.length < MAX_PHOTOS) {
      html += `
        <label class="photo-upload-slot" id="upload-slot" title="Ajouter une photo">
          <input type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadPhoto(this)">
          <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
          </svg>
          <span>Ajouter une photo</span>
        </label>
      `;
    }

    gallery.innerHTML = html;

    const section = document.getElementById('section-photos');
    if (section) section.style.display = (photos.length > 0 || isOwner) ? '' : 'none';
  }

  async function uploadPhoto(input) {
    const file = input.files?.[0];
    if (!file) return;
    const slot = document.getElementById('upload-slot');
    if (slot) slot.classList.add('loading');

    try {
      const ext  = file.name.split('.').pop() || 'jpg';
      const path = `${window._companyId}/${Date.now()}.${ext}`;
      const { error: upErr } = await window._sbClient.storage.from('company-photos').upload(path, file, { upsert: false });
      if (upErr) throw upErr;

      const { data: { publicUrl } } = window._sbClient.storage.from('company-photos').getPublicUrl(path);

      const newPhotos = [...(window._photos || []), publicUrl];
      const { error: dbErr } = await window._sbClient.from('companies').update({ photos: newPhotos }).eq('id', window._companyId);
      if (dbErr) throw dbErr;

      window._photos = newPhotos;
      renderGallery();
    } catch (e) {
      alert('Erreur upload : ' + e.message);
    } finally {
      if (slot) slot.classList.remove('loading');
    }
  }

  async function deletePhoto(index) {
    if (!confirm('Supprimer cette photo ?')) return;
    const photos    = [...(window._photos || [])];
    const [removed] = photos.splice(index, 1);

    const { error } = await window._sbClient.from('companies').update({ photos }).eq('id', window._companyId);
    if (error) { alert('Erreur : ' + error.message); return; }

    // Supprimer du storage
    try {
      const path = new URL(removed).pathname.split('/company-photos/')[1];
      if (path) await window._sbClient.storage.from('company-photos').remove([path]);
    } catch (_) {}

    window._photos = photos;
    renderGallery();
  }

  function openLightbox(url) {
    const lb = document.getElementById('lightbox');
    document.getElementById('lightbox-img').src = url;
    lb.classList.add('open');
  }

  chargerProfil();
</script>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <button class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('open')">✕</button>
  <img id="lightbox-img" src="" alt="Photo">
</div>

<script src="/i18n.js"></script>
</body>
</html>
