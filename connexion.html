<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Talenco.bj</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 32px; width: 100%; max-width: 400px; }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-title { font-family: var(--font-serif); font-style: italic; font-size: 24px; text-align: center; margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
    .auth-footer { text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="auth-page">

<nav class="navbar">
  <a href="/presentation.html" class="talenco-logo">
    <div class="nav-logo">
      <div class="nav-logo-text">
        <span class="logo-primary">Talenco</span><span class="logo-dot">.</span><span class="logo-tld">bj</span>
      </div>
      <div class="logo-tagline">Recrutement au Bénin</div>
    </div>
  </a>
  <ul class="navbar-links">
    <li><a href="/offres.html">Offres</a></li>
  </ul>
  <div class="navbar-actions">
    <a href="/inscription.html" class="btn btn-outline btn-sm">Créer un compte</a>
  </div>
</nav>

<div class="auth-center">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="nav-logo" style="align-items:center;">
        <div class="nav-logo-text">
          <span class="logo-primary">Talenco</span><span class="logo-dot">.</span><span class="logo-tld">bj</span>
        </div>
      </div>
    </div>
    <h1 class="auth-title">Connexion</h1>
    <p class="auth-sub">Accédez à votre espace Talenco.bj</p>

    <div id="auth-msg" class="alert" style="display:none;margin-bottom:16px;"></div>

    <div class="form-field">
      <label class="form-label">Adresse email</label>
      <input type="email" id="auth-email" placeholder="votre@email.com" autocomplete="email" inputmode="email">
    </div>
    <div class="form-field">
      <label class="form-label">Mot de passe</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-dark btn-full" id="btn-login" style="margin-top:8px;">
      Se connecter
    </button>

    <div class="auth-footer" style="margin-top:20px;">
      Pas encore de compte ? <a href="/inscription.html">Créer un compte gratuit</a>
    </div>
    <div class="auth-footer" style="margin-top:10px;">
      <a href="/mot-de-passe-oublie.html" style="color:var(--text-muted);">Mot de passe oublié ?</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL      = 'https://ywteoxnkkdgdpbkrlkar.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3dGVveG5ra2RnZHBia3Jsa2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MjA1MjYsImV4cCI6MjA5MDA5NjUyNn0.jzgNVgYR6iCEV_GIpvBTs4aN3RzK3E3MJW9YtBmLI3c';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const nextUrl = new URLSearchParams(location.search).get('next') || null;

  // Déjà connecté → rediriger selon le rôle
  sb.auth.getSession().then(async ({ data: { session } }) => {
    if (session) await redirectByRole(session.user.id);
  });

  function showMsg(type, text) {
    const el = document.getElementById('auth-msg');
    el.className = `alert alert-${type}`;
    el.textContent = text;
    el.style.display = 'block';
  }

  // Traduction des erreurs Supabase en français
  function traduireErreur(msg) {
    if (!msg) return 'Une erreur est survenue. Veuillez réessayer.';
    const m = msg.toLowerCase();
    if (m.includes('invalid login') || m.includes('invalid credentials'))
      return 'Email ou mot de passe incorrect. Vérifiez vos identifiants.';
    if (m.includes('email not confirmed'))
      return 'Votre email n\'est pas encore confirmé. Vérifiez votre boîte mail.';
    if (m.includes('too many requests') || m.includes('rate limit'))
      return 'Trop de tentatives. Attendez quelques minutes avant de réessayer.';
    if (m.includes('user not found'))
      return 'Aucun compte trouvé avec cet email. Vérifiez ou créez un compte.';
    if (m.includes('network') || m.includes('fetch'))
      return 'Problème de connexion réseau. Vérifiez votre connexion Internet.';
    if (m.includes('password'))
      return 'Mot de passe incorrect. Utilisez "Mot de passe oublié ?" si besoin.';
    return 'Connexion impossible. Vérifiez vos identifiants et réessayez.';
  }

  // Redirection selon le rôle utilisateur
  async function redirectByRole(userId) {
    if (nextUrl) { window.location.href = nextUrl; return; }
    try {
      const { data } = await sb.from('users').select('role').eq('id', userId).single();
      if (data?.role === 'company') {
        window.location.href = '/entreprises.html';
      } else {
        window.location.href = '/candidat.html';
      }
    } catch {
      window.location.href = '/candidat.html';
    }
  }

  async function login() {
    const email    = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const btn      = document.getElementById('btn-login');

    if (!email) { showMsg('error', 'Veuillez saisir votre adresse email.'); document.getElementById('auth-email').focus(); return; }
    if (!password) { showMsg('error', 'Veuillez saisir votre mot de passe.'); document.getElementById('auth-password').focus(); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Connexion…';
    document.getElementById('auth-msg').style.display = 'none';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg('error', traduireErreur(error.message));
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      return;
    }

    btn.textContent = 'Connexion réussie…';
    await redirectByRole(data.user.id);
  }

  document.getElementById('btn-login').addEventListener('click', login);
  document.getElementById('auth-email').addEventListener('keydown',    e => { if (e.key === 'Enter') login(); });
  document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
<script src="/nav-mobile.js"></script>
<script src="/bug-report.js"></script>
</body>
</html>
