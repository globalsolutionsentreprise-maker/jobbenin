<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Invitations entreprises</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    body { background: var(--bg-soft); }
    .admin-wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px; }
    .admin-header { margin-bottom: 32px; }
    .admin-back { display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:20px; }
    .admin-back:hover { color: var(--text); }
    .admin-title { font-family:var(--font-serif);font-style:italic;font-size:28px;margin-bottom:6px; }
    .admin-sub { font-size:13px;color:var(--text-muted); }
    .card { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px; }
    .stats-row { display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px; }
    .stat-box { background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;text-align:center; }
    .stat-num { font-family:var(--font-serif);font-style:italic;font-size:32px;color:var(--accent);line-height:1; }
    .stat-label { font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-top:4px; }
    .invite-table { width:100%;border-collapse:collapse;margin-top:16px; }
    .invite-table th { font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border); }
    .invite-table td { padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle; }
    .invite-table tr:last-child td { border-bottom:none; }
    .token-cell { font-family:var(--font-mono);font-size:11px;color:var(--text-mid);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .status-badge { display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:3px 9px;border-radius:999px; }
    .status-badge.pending { background:rgba(139,69,19,.08);color:var(--accent); }
    .status-badge.used    { background:var(--bg-soft);color:var(--text-muted); }
    .copy-btn { padding:6px 12px;font-size:12px;font-family:var(--font-body);font-weight:500;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius-sm);cursor:pointer;transition:opacity .15s;white-space:nowrap; }
    .copy-btn:hover { opacity:.85; }
    .copy-btn.copied { background:var(--accent);color:#fff; }
    .copy-btn:disabled { opacity:.4;cursor:default; }
    .empty-state { text-align:center;padding:40px;color:var(--text-muted);font-size:13px; }
    #btn-generate { margin-bottom:24px; }
  </style>
</head>
<body>

<div class="admin-wrap" id="admin-content" style="display:none;">
  <div class="admin-header">
    <a href="/admin.html" class="admin-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Retour admin
    </a>
    <h1 class="admin-title">Invitations entreprises</h1>
    <p class="admin-sub">Gérez les 15 accès recruteurs de la phase bêta.</p>
  </div>

  <div class="stats-row" id="stats-row">
    <div class="stat-box"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-pending">—</div><div class="stat-label">Disponibles</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-used">—</div><div class="stat-label">Activés</div></div>
  </div>

  <div class="card">
    <button class="btn btn-dark" id="btn-generate" onclick="generateInvites()">
      Générer les 15 invitations
    </button>
    <div id="table-area">
      <div class="empty-state" id="empty-msg">Aucune invitation générée. Cliquez sur le bouton ci-dessus pour créer les 15 liens.</div>
      <table class="invite-table" id="invite-table" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Token</th>
            <th>Statut</th>
            <th>Entreprise</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="invite-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL      = 'https://ywteoxnkkdgdpbkrlkar.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3dGVveG5ra2RnZHBia3Jsa2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MjA1MjYsImV4cCI6MjA5MDA5NjUyNn0.jzgNVgYR6iCEV_GIpvBTs4aN3RzK3E3MJW9YtBmLI3c';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const SITE_URL = window.location.origin;

  sb.auth.getSession().then(async ({ data: { session } }) => {
    if (!session) { window.location.href = '/connexion.html'; return; }
    const { data: profile } = await sb.from('users').select('role').eq('id', session.user.id).maybeSingle();
    if (profile?.role !== 'admin') { window.location.href = '/'; return; }
    document.getElementById('admin-content').style.display = 'block';
    loadInvites();
  });

  async function loadInvites() {
    const { data } = await sb
      .from('enterprise_invites')
      .select('*')
      .order('created_at', { ascending: true });

    if (!data || data.length === 0) {
      document.getElementById('empty-msg').style.display = 'block';
      document.getElementById('invite-table').style.display = 'none';
      document.getElementById('stat-total').textContent   = '0';
      document.getElementById('stat-pending').textContent = '0';
      document.getElementById('stat-used').textContent    = '0';
      return;
    }

    const pending = data.filter(r => r.status === 'pending').length;
    const used    = data.filter(r => r.status === 'used').length;
    document.getElementById('stat-total').textContent   = data.length;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-used').textContent    = used;

    if (data.length >= 15) {
      document.getElementById('btn-generate').style.display = 'none';
    }

    renderTable(data);
  }

  function renderTable(data) {
    const tbody = document.getElementById('invite-tbody');
    tbody.innerHTML = '';
    data.forEach((row, i) => {
      const link = `${SITE_URL}/invitation-entreprise.html?token=${row.token}`;
      const tr   = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">${String(i+1).padStart(2,'0')}</td>
        <td class="token-cell" title="${row.token}">${row.token}</td>
        <td>
          <span class="status-badge ${row.status}">
            ${row.status === 'pending' ? 'Disponible' : 'Activé'}
          </span>
        </td>
        <td style="font-size:12px;color:var(--text-muted);">${row.company_name || '—'}</td>
        <td>
          <button class="copy-btn" id="copy-${row.id}" ${row.status === 'used' ? 'disabled' : ''} onclick="copyLink('${link}', '${row.id}')">
            ${row.status === 'used' ? 'Utilisé' : 'Copier le lien'}
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    document.getElementById('empty-msg').style.display = 'none';
    document.getElementById('invite-table').style.display = 'table';
  }

  function copyLink(link, id) {
    navigator.clipboard.writeText(link).then(() => {
      const btn = document.getElementById('copy-' + id);
      btn.textContent = 'Copié !';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copier le lien'; btn.classList.remove('copied'); }, 2000);
    });
  }

  async function generateInvites() {
    const btn = document.getElementById('btn-generate');
    btn.disabled = true;
    btn.textContent = 'Génération en cours…';
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res  = await fetch('/api/generate-invites', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({})
      });
      const data = await res.json();
      if (!res.ok) { alert('Erreur : ' + (data.error || 'Inconnue')); btn.disabled = false; btn.textContent = 'Générer les 15 invitations'; return; }
      await loadInvites();
    } catch (err) {
      alert('Erreur réseau.');
      btn.disabled = false;
      btn.textContent = 'Générer les 15 invitations';
    }
  }
</script>
<script src="/i18n.js"></script>
</body>
</html>
