<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement échoué — Talenco.bj</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#040D1C;color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#091628;border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:3rem 2.5rem;max-width:440px;width:100%;text-align:center}
.err-circle{width:80px;height:80px;border-radius:50%;background:rgba(232,64,64,.12);border:2px solid rgba(232,64,64,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem}
h1{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;margin-bottom:.5rem}
.msg{color:#7B90B0;font-size:.95rem;line-height:1.65;margin-bottom:2rem}
.btn{display:inline-block;background:#F0A500;color:#000;padding:.85rem 2rem;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none;cursor:pointer;border:none;font-family:'Outfit',sans-serif}
</style>
</head>
<body>
<div class="card">
  <div class="err-circle">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E84040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
  <h1>Paiement échoué</h1>
  <p class="msg">Le paiement n'a pas abouti. Aucun montant n'a été débité. Vérifiez votre solde Mobile Money et réessayez.</p>
  <button class="btn" onclick="history.back()">Réessayer →</button>
</div>
</body></html>
