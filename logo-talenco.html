<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Talenco.bj</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:  #8B4513;
      --gold:    #C8892A;
      --bg:      #F9F6F1;
      --text:    #1a1208;
      --muted:   #b0998a;
      --border:  #e2d8cf;
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════
       MARK — deux arcs formant un losange
       représentant la rencontre talent↔entreprise
       ═══════════════════════════════════════ */

    .mark-arc {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    #arc-top {
      stroke-dasharray: 72;
      stroke-dashoffset: 72;
      animation: draw-arc 0.8s cubic-bezier(0.4,0,0.2,1) 0.25s forwards;
    }
    #arc-bottom {
      stroke-dasharray: 72;
      stroke-dashoffset: 72;
      animation: draw-arc 0.8s cubic-bezier(0.4,0,0.2,1) 0.65s forwards;
    }
    @keyframes draw-arc { to { stroke-dashoffset: 0; } }

    /* Dot central */
    #mark-dot {
      fill: var(--accent);
      transform-origin: 34px 34px;
      r: 0;
      animation: pop-dot 0.55s cubic-bezier(0.34,1.56,0.64,1) 1.15s forwards;
    }
    @keyframes pop-dot { to { r: 4.5; } }

    /* Anneau pulsant (idle) */
    #pulse-a, #pulse-b {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.2;
      r: 4.5;
      opacity: 0;
      transform-origin: 34px 34px;
    }
    #pulse-a { animation: pulse-ring 3s ease-out 1.8s infinite; }
    #pulse-b { animation: pulse-ring 3s ease-out 2.9s infinite; }
    @keyframes pulse-ring {
      0%   { r: 4.5; opacity: 0.65; }
      100% { r: 22;  opacity: 0;    }
    }

    /* ═══════════════════════════════════════
       WORDMARK
       ═══════════════════════════════════════ */

    .wordmark { display: block; }

    .logo-name {
      display: block;
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 0 0 5px 0;
      padding: 0;
      opacity: 0;
      transform: translateY(14px);
      animation: rise-in 0.75s cubic-bezier(0.4,0,0.2,1) 1.1s forwards;
    }
    .logo-name .base { color: var(--text); }
    .logo-name .co   { color: var(--accent); }

    .logo-sub {
      display: block;
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-indent: -0.18em;
      text-transform: uppercase;
      margin: 0;
      padding: 0;
      opacity: 0;
      transform: translateY(8px);
      animation: rise-in 0.5s cubic-bezier(0.4,0,0.2,1) 1.6s forwards;
    }

    @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }

    /* ═══════════════════════════════════════
       LAYOUT — version lumière (principale)
       ═══════════════════════════════════════ */

    .logo-light {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 48px 56px;
      cursor: pointer;
    }

    /* ═══════════════════════════════════════
       TAGLINE + SÉPARATEUR
       ═══════════════════════════════════════ */

    .tagline {
      font-family: 'DM Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.28em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0;
      animation: rise-in 0.4s ease 2s forwards;
    }

    .sep {
      width: 280px;
      height: 1px;
      background: var(--border);
      margin: 36px 0;
      opacity: 0;
      animation: rise-in 0.3s ease 2.1s forwards;
    }

    /* ═══════════════════════════════════════
       VERSION SOMBRE
       ═══════════════════════════════════════ */

    .logo-dark-wrap {
      background: #1a1208;
      border-radius: 18px;
      padding: 36px 48px;
      display: flex;
      align-items: center;
      gap: 22px;
      opacity: 0;
      animation: rise-in 0.5s ease 2.2s forwards;
    }

    .logo-dark-wrap .logo-name .base { color: #f5ede3; }
    .logo-dark-wrap .logo-name .co   { color: var(--gold); }
    .logo-dark-wrap .logo-sub        { color: var(--gold); }

    /* ═══════════════════════════════════════
       CONTRÔLES
       ═══════════════════════════════════════ */

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 36px;
      opacity: 0;
      animation: rise-in 0.4s ease 2.5s forwards;
    }

    .btn {
      padding: 9px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { opacity: 0.88; }

    /* ═══════════════════════════════════════
       CREDIT
       ═══════════════════════════════════════ */

    .credit {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--border);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 28px;
      opacity: 0;
      animation: rise-in 0.3s ease 2.8s forwards;
    }
  </style>
</head>
<body>

  <!-- ── Version lumière (animée) ─────────────────── -->
  <div class="logo-light" id="logo-main" title="Cliquer pour rejouer l'animation">

    <svg id="mark-svg" width="68" height="68" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
      <!-- Anneaux pulsants (idle) -->
      <circle id="pulse-a" cx="34" cy="34"/>
      <circle id="pulse-b" cx="34" cy="34"/>
      <!-- Arc supérieur : de gauche vers droite en passant par le haut -->
      <path id="arc-top"    class="mark-arc" d="M8,34 Q34,7 60,34"/>
      <!-- Arc inférieur : de droite vers gauche en passant par le bas -->
      <path id="arc-bottom" class="mark-arc" d="M60,34 Q34,61 8,34"/>
      <!-- Point central -->
      <circle id="mark-dot" cx="34" cy="34"/>
    </svg>

    <div class="wordmark">
      <div class="logo-name">
        <span class="base">Talen</span><span class="co">co</span>
      </div>
      <div class="logo-sub">Bénin</div>
    </div>
  </div>

  <div class="tagline">Recrutement &nbsp;·&nbsp; Talent &nbsp;·&nbsp; Bénin</div>

  <div class="sep"></div>

  <!-- ── Version sombre (statique) ────────────────── -->
  <div class="logo-dark-wrap">
    <svg width="58" height="58" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
      <path d="M8,34 Q34,7 60,34"  fill="none" stroke="#C8892A" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M60,34 Q34,61 8,34" fill="none" stroke="#C8892A" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="34" cy="34" r="4.5" fill="#C8892A"/>
    </svg>
    <div class="wordmark">
      <div class="logo-name" style="opacity:1;transform:none;font-size:48px;">
        <span class="base">Talen</span><span class="co">co</span>
      </div>
      <div class="logo-sub" style="opacity:1;transform:none;text-indent:-0.18em;">Bénin</div>
    </div>
  </div>

  <!-- ── Contrôles ─────────────────────────────────── -->
  <div class="controls">
    <button class="btn" onclick="rejouer()">↺ Rejouer</button>
    <button class="btn primary" onclick="dlSVG('light')">↓ SVG fond clair</button>
    <button class="btn" onclick="dlSVG('dark')">↓ SVG fond sombre</button>
    <button class="btn" onclick="dlPNG('light')">↓ PNG transparent</button>
  </div>

  <div class="credit">Talenco.bj — Logo v1 — 2026</div>

<script>
  /* ─── Rejouer ─────────────────────────────────────── */
  document.getElementById('logo-main').addEventListener('click', rejouer);

  function rejouer() {
    // Reset toutes les animations CSS en clonant le SVG et le wordmark
    const main  = document.getElementById('logo-main');
    const clone = main.cloneNode(true);
    main.parentNode.replaceChild(clone, main);
    clone.addEventListener('click', rejouer);
  }

  /* ─── Génération SVG statique ─────────────────────── */
  function buildSVG(dark) {
    const bg      = dark ? '#1a1208' : '#F9F6F1';
    const text1   = dark ? '#f5ede3' : '#1a1208';
    const accent  = dark ? '#C8892A' : '#8B4513';

    return `<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 360 100" width="720" height="200">
  <rect width="360" height="100" fill="${bg}"/>
  <!-- Mark -->
  <path d="M12,50 Q42,18 72,50" fill="none" stroke="${accent}" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M72,50 Q42,82 12,50" fill="none" stroke="${accent}" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="42" cy="50" r="5" fill="${accent}"/>
  <!-- Wordmark -->
  <text x="96" y="66"
    font-family="'Instrument Serif', Georgia, serif"
    font-style="italic"
    font-size="54"
    letter-spacing="-0.6"
    fill="${text1}">Talen</text>
  <text x="267" y="66"
    font-family="'Instrument Serif', Georgia, serif"
    font-style="italic"
    font-size="54"
    letter-spacing="-0.6"
    fill="${accent}">co</text>
  <!-- Sub -->
  <text x="97" y="86"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="11"
    letter-spacing="2.8"
    fill="${accent}">BÉNIN</text>
</svg>`;
  }

  function dlSVG(variant) {
    const dark = variant === 'dark';
    const blob = new Blob([buildSVG(dark)], { type: 'image/svg+xml;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    trigger(url, `talenco-logo-${variant}.svg`);
  }

  /* ─── Export PNG via canvas ────────────────────────── */
  function dlPNG(variant) {
    const scale = 3; // 3× pour haute résolution
    const w = 720, h = 200;

    const svgStr  = buildSVG(false); // fond transparent ensuite
    const blob    = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url     = URL.createObjectURL(blob);
    const img     = new Image();

    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width  = w * scale;
      canvas.height = h * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob2 => {
        trigger(URL.createObjectURL(blob2), 'talenco-logo.png');
      }, 'image/png');
    };
    img.src = url;
  }

  function trigger(url, name) {
    const a = document.createElement('a');
    a.href     = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
</script>
</body>
</html>
