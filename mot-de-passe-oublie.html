<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Talenco.bj</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="/design-system.css">
</head>
<body>
<nav class="navbar">
  <a href="/index.html" class="talenco-logo">
    <div class="nav-logo">
      <div class="nav-logo-text"><span class="logo-primary">Talenco</span><span class="logo-dot">.</span><span class="logo-tld">bj</span></div>
      <div class="logo-tagline">Recrutement au Bénin</div>
    </div>
  </a>
</nav>

<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="background:#fff;border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:420px;text-align:center;">

    <div id="auth-msg" style="display:none;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;"></div>

    <!-- Étape 1 : demande d'email -->
    <div id="step-email">
      <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;margin-bottom:8px;">Mot de passe oublié</div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:28px;">Entrez votre adresse email, nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
      <div style="display:flex;flex-direction:column;gap:14px;text-align:left;">
        <div>
          <label style="font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:6px;">Adresse email</label>
          <input type="email" id="reset-email" placeholder="votre@email.com" autocomplete="email"
            style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;">
        </div>
        <button id="btn-send" class="btn btn-dark btn-full" style="margin-top:4px;">Envoyer le lien</button>
      </div>
      <p style="margin-top:20px;font-size:12px;color:var(--text-muted);">
        <a href="/connexion.html" style="color:var(--text-muted);">← Retour à la connexion</a>
      </p>
    </div>

    <!-- Étape 2 : saisie du nouveau mot de passe -->
    <div id="step-password" style="display:none;">
      <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;margin-bottom:8px;">Nouveau mot de passe</div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:28px;">Choisissez un mot de passe sécurisé pour votre compte.</p>
      <div style="display:flex;flex-direction:column;gap:14px;text-align:left;">
        <div>
          <label style="font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:6px;">Nouveau mot de passe</label>
          <input type="password" id="new-password" placeholder="Minimum 8 caractères" autocomplete="new-password"
            style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;">
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:6px;">Confirmer le mot de passe</label>
          <input type="password" id="confirm-password" placeholder="Répétez le mot de passe" autocomplete="new-password"
            style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;">
        </div>
        <button id="btn-reset" class="btn btn-dark btn-full" style="margin-top:4px;">Enregistrer le mot de passe</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  var SUPABASE_URL = 'https://ywteoxnkkdgdpbkrlkar.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3dGVveG5ra2RnZHBia3Jsa2FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MjA1MjYsImV4cCI6MjA5MDA5NjUyNn0.jzgNVgYR6iCEV_GIpvBTs4aN3RzK3E3MJW9YtBmLI3c';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(type, text) {
    const el = document.getElementById('auth-msg');
    el.style.display = 'block';
    el.style.background = type === 'error' ? '#fef2f2' : '#f0fdf4';
    el.style.color = type === 'error' ? '#b91c1c' : '#15803d';
    el.style.border = '1px solid ' + (type === 'error' ? '#fca5a5' : '#86efac');
    el.textContent = text;
  }

  function showStep(step) {
    document.getElementById('step-email').style.display = step === 'email' ? '' : 'none';
    document.getElementById('step-password').style.display = step === 'password' ? '' : 'none';
  }

  // Détecter si on arrive avec un token de récupération dans l'URL
  const hash = window.location.hash;
  const params = new URLSearchParams(hash.substring(1));
  const accessToken = params.get('access_token');
  const refreshToken = params.get('refresh_token');
  const urlType = params.get('type');

  if (accessToken && (urlType === 'recovery' || urlType === 'invite')) {
    showStep('password');
    sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' })
      .then(({ error }) => {
        if (error) {
          showStep('email');
          showMsg('error', '❌ Lien invalide ou expiré. Recommencez.');
        }
      });
  } else {
    // Écoute au cas où Supabase intercepte le token automatiquement (PKCE flow)
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showStep('password');
    });
    showStep('email');
  }

  // Étape 1 — envoi du lien de récupération
  document.getElementById('btn-send').addEventListener('click', async () => {
    const email = document.getElementById('reset-email').value.trim();
    const btn = document.getElementById('btn-send');
    if (!email) { showMsg('error', '❌ Veuillez entrer votre adresse email.'); return; }
    btn.disabled = true;
    btn.textContent = '⏳ Envoi…';
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://talenco-bj.vercel.app/mot-de-passe-oublie.html',
    });
    if (error) {
      showMsg('error', '❌ ' + error.message);
      btn.disabled = false;
      btn.textContent = 'Envoyer le lien';
    } else {
      showMsg('success', '✅ Email envoyé ! Vérifiez votre boîte mail (et les spams).');
      btn.textContent = 'Email envoyé ✓';
    }
  });

  // Étape 2 — enregistrement du nouveau mot de passe
  document.getElementById('btn-reset').addEventListener('click', async () => {
    const password = document.getElementById('new-password').value;
    const confirm  = document.getElementById('confirm-password').value;
    const btn = document.getElementById('btn-reset');
    if (password.length < 8) { showMsg('error', '❌ Le mot de passe doit contenir au moins 8 caractères.'); return; }
    if (password !== confirm) { showMsg('error', '❌ Les mots de passe ne correspondent pas.'); return; }
    btn.disabled = true;
    btn.textContent = '⏳ Enregistrement…';
    const { error } = await sb.auth.updateUser({ password });
    if (error) {
      showMsg('error', '❌ ' + error.message);
      btn.disabled = false;
      btn.textContent = 'Enregistrer le mot de passe';
    } else {
      showMsg('success', '✅ Mot de passe mis à jour ! Redirection…');
      btn.textContent = 'Mot de passe mis à jour ✓';
      setTimeout(() => window.location.href = '/connexion.html', 2000);
    }
  });
</script>
<script src="/nav-mobile.js"></script>
<script src="/bug-report.js"></script>
</body>
</html>
